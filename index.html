<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GameWeave</title>
    <style>
        :root {
            color-scheme: light dark;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.55;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7fa;
            color: #1a2231;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #0f1620; color: #d8dee9; }
            a { color: #88c0d0; }
        }
        main {
            max-width: 680px;
            padding: 48px 24px;
            text-align: center;
        }
        h1 {
            margin: 0 0 16px;
            font-size: 2.4rem;
            letter-spacing: -0.02em;
        }
        p { margin: 0 0 24px; color: inherit; opacity: 0.85; }
        nav {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 32px;
        }
        nav a {
            display: inline-block;
            padding: 10px 18px;
            border: 1px solid currentColor;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 500;
        }
        nav a:hover { opacity: 0.7; }
        footer {
            margin-top: 48px;
            font-size: 0.85rem;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <main>
        <h1>GameWeave</h1>
        <p>A multiplayer card-game platform — Blackjack, Poker, Durak, Hearts, and Spades.</p>
        <p>This site hosts the legal documents that govern the GameWeave Android app.</p>
        <nav>
            <a href="privacy.html">Privacy Policy</a>
            <a href="terms.html">Terms of Service</a>
        </nav>
        <footer>Operated by Boris Rayskiy &middot; Contact: brayskiy@gmail.com</footer>
    </main>
</body>
</html>
